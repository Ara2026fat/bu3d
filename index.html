*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2) 72%);color:var(--ink);

body::before{width:58vw;height:58vw;top:-14vw;inset-inline-start:-12vw;background:var(--b1)}
body::after{width:52vw;height:52vw;bottom:-16vw;inset-inline-end:-14vw;background:var(--b2)}
img{display:block;max-width:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
.dim{color:var(--dim)}
.disp{font-weight:900;letter-spacing:-.01em}

 border:1px solid var(--gline);border-radius:24px;

.card{background:linear-gradient(140deg,var(--gl1),var(--gl2));border:1px solid var(--gline);border-radius:18px;

.card:active{transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 6px var(--bevelBot)}
.orb{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--on);font-weight:900;
 background:radial-gradient(circle at 34% 28%,var(--a2),var(--a1) 78%);
 box-shadow:0 8px 16px -6px var(--acc),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.22)}

.app{position:relative;z-index:1;height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
 padding:0 0 env(safe-area-inset-bottom)}
.app::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:var(--wmImg);
 background-size:130px;background-repeat:repeat;opacity:var(--wm)}
.crown{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
.blogo{background:none;border:none;padding:0;cursor:pointer;line-height:0;flex-shrink:0}
.blogo img{width:54px;filter:drop-shadow(0 3px 6px rgba(20,40,70,.25))}
.tabs{display:flex;gap:8px;flex:1;min-width:0}
.tab{flex:1;min-width:0;height:52px;padding:0 6px;border:1px solid var(--gline);cursor:pointer;border-radius:18px;

.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{color:var(--on);border-color:transparent;background:linear-gradient(165deg,var(--a2),var(--a1));
 box-shadow:0 10px 18px -10px var(--acc),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 7px rgba(0,0,0,.18)}
.act{width:52px;height:52px;flex-shrink:0;border-radius:50%;cursor:pointer;position:relative;color:var(--ink);display:grid;place-items:center;

 box-shadow:var(--sh2),inset 0 1px 0 var(--bevelTop),inset 0 -2px 5px var(--bevelBot),inset 0 0 0 1px var(--edge)}

.badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;

.filters{flex-shrink:0;padding:0 16px 10px}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;scrollbar-width:none}

.plist{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;scrollbar-width:none}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gridp{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px 2px}
.hs::-webkit-scrollbar{display:none}

.btn.p{background:linear-gradient(165deg,var(--a2),var(--a1));color:var(--on);

.btn.full{width:100%}

.chip.on{background:linear-gradient(165deg,var(--a2),var(--a1));color:var(--on);border-color:transparent;
 box-shadow:0 6px 12px -7px var(--acc),inset 0 1px 0 rgba(255,255,255,.4)}
.input{width:100%;background:var(--soft);border:1px solid var(--sline);border-radius:14px;padding:12px 14px;font-size:14.5px;outline:none}

.lbl{font-size:11.5px;color:var(--dim);display:block;margin-bottom:6px;font-weight:500}
.eyebrow{font-size:10.5px;letter-spacing:.12em;color:var(--acc);font-weight:900;text-transform:uppercase}
.media{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:rgba(255,255,255,.4)}

.media img{width:100%;height:100%;object-fit:cover}
.pill{font-size:9px;font-weight:900;padding:3px 8px;border-radius:99px;background:linear-gradient(165deg,var(--a2),var(--a1));color:var(--on)}
.rule{display:flex;align-items:center;gap:9px;margin:15px 0 11px;color:var(--acc);font-size:11px;font-weight:900}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.4}

/* ── the pipeline ── */
.pipe{display:grid;gap:0;margin-top:6px}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.step::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:0;width:2px;background:var(--sline)}
.step:last-child::before{display:none}
.step.done::before{background:linear-gradient(180deg,var(--a1),var(--a2))}
.dot{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:900;
 background:var(--soft);border:1px solid var(--sline);color:var(--dim);z-index:1}
.step.done .dot{background:linear-gradient(165deg,var(--a2),var(--a1));color:var(--on);border-color:transparent;
 box-shadow:0 6px 12px -6px var(--acc),inset 0 1px 0 rgba(255,255,255,.45)}
.step.now .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),0 6px 12px -6px var(--acc)}
.stitle{font-size:13.5px;font-weight:900;padding-top:6px}
.snote{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.7}

.ov{position:fixed;inset:0;z-index:80;background:rgba(16,26,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 display:flex;align-items:flex-end;justify-content:center;animation:fade .18s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:760px;max-height:92dvh;overflow-y:auto;scrollbar-width:none;
 background:linear-gradient(170deg,var(--bg1),var(--bg2) 85%);border:1px solid var(--gline);

 box-shadow:0 -20px 60px -20px rgba(16,30,50,.5);animation:fade .18s both}
.sheet::-webkit-scrollbar{display:none}
.handle{width:42px;height:4px;border-radius:4px;background:var(--sline);margin:0 auto 14px}
.toast{position:fixed;bottom:26px;inset-inline:0;display:flex;justify-content:center;z-index:99;pointer-events:none}
.toast div{background:linear-gradient(165deg,var(--a2),var(--a1));color:var(--on);padding:11px 20px;border-radius:999px;
 font-size:13.5px;font-weight:700;box-shadow:0 14px 30px -12px var(--acc)}
.ibar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:10px;
 padding:10px 12px;border-radius:20px;max-width:736px;margin:0 auto;background:linear-gradient(160deg,var(--gl1),var(--gl2));
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gline);box-shadow:var(--sh)}
.swatch{border:none;background:none;cursor:pointer;padding:6px;border-radius:18px;text-align:center}
.swatch.on{box-shadow:0 0 0 2px var(--acc)}
.swatch i{display:block;height:48px;border-radius:13px;box-shadow:var(--sh2)}
.swatch span{display:block;font-size:11.5px;margin-top:7px;font-weight:700}
.dotc{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.dotc.on{border-color:var(--ink)}
canvas.cv{width:100%;border-radius:16px;background:rgba(0,0,0,.06);touch-action:none;display:block}
.range{width:100%;accent-color:var(--acc)}
.drop{border:1.5px dashed var(--sline);border-radius:16px;padding:20px;text-align:center;cursor:pointer;background:var(--soft)}
.hide{display:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
